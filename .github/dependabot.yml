version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "ng-packagr"
          - "angular-eslint"
          - "@angular-eslint/*"
        update-types:
          - minor
          - patch
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
      dev-tools:
        patterns:
          - "prettier"
          - "tsx"
          - "vitest"
          - "jsdom"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
