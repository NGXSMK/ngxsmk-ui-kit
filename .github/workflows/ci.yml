name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint all projects
        run: npm run lint

      - name: Verify design system governance
        run: npm run governance

      - name: Verify component consistency
        run: npm run audit:consistency

      - name: Verify accessibility standards
        run: npm run audit:a11y

      - name: Verify component simplicity & complexity standards
        run: npm run audit:complexity

      - name: Verify migration codemods
        run: npm run test:migration

      - name: Verify Technical SEO & GEO
        run: npm run audit:seo

      - name: Verify Documentation Quality & Links
        run: npm run audit:docs

      - name: Verify smoke specs stay in sync
        run: npm run test:smoke:check

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome
        # Pin to the v1 tag commit for supply-chain integrity.
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1

      - name: Run unit tests
        run: npm test

      - name: CDK coverage gate
        run: npx ng test @ngxsmk/cdk --watch=false --configuration=coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all packages + demo
        run: npm run build

      - name: Check bundle sizes
        run: npm run size

      - name: Run performance laboratory benchmarks
        run: npm run perf:lab

      - name: Check zoneless output
        run: npm run check:zoneless

  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: write
    # Auto-committing baselines requires write access to the head branch.
    # Fork PRs get a read-only token — skip the push path for those.
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Check out the actual head branch so we are not in detached HEAD state.
          # For PRs this is the source branch; for pushes it is the pushed branch.
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build demo
        run: npm run theme:css && npm run build:demo

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Baselines live in tests/visual/__screenshots__ and must be Linux-rendered.
      # --update-snapshots=missing writes new PNGs for any missing baseline and
      # then this step commits them back to the branch automatically (same-repo only).
      - name: Run visual tests
        id: visual
        run: npm run visual -- --update-snapshots=missing
        continue-on-error: true

      - name: Commit new baselines if written
        if: >
          always() &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__screenshots__/ || true
          if git diff --cached --quiet; then
            echo "No new baselines to commit."
          else
            git commit -m "chore(visual): update linux-rendered visual baselines [skip ci]"
            git push origin "HEAD:${BRANCH}"
          fi

      - name: Fail if visual tests failed and no new baselines were written
        if: steps.visual.outcome == 'failure'
        run: |
          git diff --cached --quiet tests/visual/__screenshots__/ && \
            echo "Visual tests failed with no new baselines — real regression detected." && \
            exit 1 || \
            echo "New baselines were written and committed — first-run pass."

      - name: Upload baselines
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-baselines
          path: tests/visual/__screenshots__/
          retention-days: 14

      - name: Upload diff report
        # success() is implied for bare `if:` expressions, so without always()
        # this step is skipped whenever a prior step (the explicit fail) failed.
        if: ${{ always() && steps.visual.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-regression-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
