name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint all projects
        run: npm run lint

      - name: Verify design system governance
        run: npm run governance

      - name: Verify component consistency
        run: npm run audit:consistency

      - name: Verify accessibility standards
        run: npm run audit:a11y

      - name: Verify component simplicity & complexity standards
        run: npm run audit:complexity

      - name: Verify migration codemods
        run: npm run test:migration

      - name: Verify Technical SEO & GEO
        run: npm run audit:seo

      - name: Verify Documentation Quality & Links
        run: npm run audit:docs

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run unit tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all packages + demo
        run: npm run build

      - name: Check bundle sizes
        run: npm run size

      - name: Run performance laboratory benchmarks
        run: npm run perf:lab

      - name: Check zoneless output
        run: npm run check:zoneless

  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build demo
        run: npm run theme:css && npm run build:demo

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Baselines are committed under tests/visual/__screenshots__ and must be
      # rendered on Linux. "--update-snapshots missing" bootstraps any missing
      # baseline (uploaded as an artifact below — commit it from there) while
      # still comparing against every existing one.
      - name: Run visual tests
        run: npm run visual -- --update-snapshots=missing

      - name: Upload baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: tests/visual/__screenshots__/
          retention-days: 14

      - name: Upload diff report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
