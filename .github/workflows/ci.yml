name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint all projects
        run: npm run lint

      - name: Verify design system governance
        run: npm run governance

      - name: Verify component consistency
        run: npm run audit:consistency

      - name: Verify accessibility standards
        run: npm run audit:a11y

      - name: Verify component simplicity & complexity standards
        run: npm run audit:complexity

      - name: Verify migration codemods
        run: npm run test:migration

      - name: Verify Technical SEO & GEO
        run: npm run audit:seo

      - name: Verify Documentation Quality & Links
        run: npm run audit:docs

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run unit tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all packages + demo
        run: npm run build

      - name: Check bundle sizes
        run: npm run size

      - name: Run performance laboratory benchmarks
        run: npm run perf:lab

      - name: Check zoneless output
        run: npm run check:zoneless

  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Check out the actual head branch so we are not in detached HEAD state.
          # For PRs this is the source branch; for pushes it is the pushed branch.
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build demo
        run: npm run theme:css && npm run build:demo

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Baselines live in tests/visual/__screenshots__ and must be Linux-rendered.
      # --update-snapshots=missing writes new PNGs for any missing baseline and
      # then this step commits them back to the branch automatically.
      - name: Run visual tests
        id: visual
        run: npm run visual -- --update-snapshots=missing
        continue-on-error: true

      - name: Commit new baselines if written
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__screenshots__/ || true
          if git diff --cached --quiet; then
            echo "No new baselines to commit."
          else
            BRANCH="${{ github.head_ref || github.ref_name }}"
            git commit -m "chore(visual): update linux-rendered visual baselines [skip ci]"
            git push origin "HEAD:${BRANCH}"
          fi

      - name: Fail if visual tests failed and no new baselines were written
        if: steps.visual.outcome == 'failure'
        run: |
          git diff --cached --quiet tests/visual/__screenshots__/ && \
            echo "Visual tests failed with no new baselines — real regression detected." && \
            exit 1 || \
            echo "New baselines were written and committed — first-run pass."

      - name: Upload baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: tests/visual/__screenshots__/
          retention-days: 14

      - name: Upload diff report
        if: steps.visual.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
