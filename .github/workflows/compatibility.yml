name: Compatibility

# Proves the publishable libraries (@ngxsmk/theme, @ngxsmk/cdk, @ngxsmk/core)
# compile against every supported Angular major (17.3+). Each job installs the
# target Angular toolchain, derives the matching TypeScript version from
# @angular/compiler-cli's peer range, generates a libs-only angular.json, and
# builds the three packages with that major's Angular CLI. Partial-Ivy output
# built with an older major is forward-compatible, so building with the lowest
# supported major (17) already guarantees runtime compatibility across 17 -> 22;
# the full matrix is run for extra confidence.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  libs:
    name: Build libs on Angular ${{ matrix.ng }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ng: ['17', '18', '19', '20', '21', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install baseline dependencies
        run: npm ci

      - name: Pin Angular ${{ matrix.ng }} toolchain
        run: |
          if [ "${{ matrix.ng }}" = "17" ] || [ "${{ matrix.ng }}" = "18" ]; then
            BUILDER="@angular-devkit/build-angular"
          else
            BUILDER="@angular/build"
          fi
          # Supported floor is 17.3 (signal output()), so install the 17.3 line.
          FLOOR=$([ "${{ matrix.ng }}" = "17" ] && echo "17.3" || echo "${{ matrix.ng }}")
          npm install --no-save --legacy-peer-deps \
            "@angular/core@^${FLOOR}.0" \
            "@angular/common@^${FLOOR}.0" \
            "@angular/compiler@^${FLOOR}.0" \
            "@angular/compiler-cli@^${FLOOR}.0" \
            "@angular/platform-browser@^${FLOOR}.0" \
            "@angular/forms@^${FLOOR}.0" \
            "@angular/animations@^${FLOOR}.0" \
            "@angular/cdk@^${FLOOR}.0" \
            "ng-packagr@^${FLOOR}.0" \
            "@angular/cli@^${FLOOR}.0" \
            "$BUILDER@^${FLOOR}.0" \
            "tslib"

      - name: Install matching TypeScript
        run: |
          TS=$(node -e "console.log(require('@angular/compiler-cli/package.json').peerDependencies.typescript)")
          echo "TypeScript peer for Angular ${{ matrix.ng }}: $TS"
          npm install --no-save --legacy-peer-deps "typescript@$TS"

      - name: Generate libs-only angular.json
        run: node tools/scripts/gen-ci-angularjson.mjs ${{ matrix.ng }}

      - name: Build libraries
        run: |
          npx -p @angular/cli@${{ matrix.ng }} ng build --project @ngxsmk/theme --configuration development
          npx -p @angular/cli@${{ matrix.ng }} ng build --project @ngxsmk/cdk --configuration development
          npx -p @angular/cli@${{ matrix.ng }} ng build --project @ngxsmk/core --configuration development
