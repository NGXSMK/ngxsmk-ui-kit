    <!-- Geist loaded via @font-face in styles.scss (Ink theme) -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('ngxsmk-theme-mode') || 'system';
          var isDark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
